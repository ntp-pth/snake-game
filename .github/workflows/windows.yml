name: Windows build and logic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win32
      - name: Build C++17 Win32 application and tests
        shell: cmd
        run: |
          mkdir build
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /O2 main.cpp /Fo:build\main.obj /Fe:build\snake.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib ole32.lib uuid.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /O2 tests\game_tests.cpp /Fo:build\game_tests.obj /Fe:build\game_tests.exe
          if errorlevel 1 exit /b 1
          build\game_tests.exe
      - uses: actions/upload-artifact@v4
        with:
          name: snake-win32
          path: build/snake.exe
